<div class="conversations-shell">
    <mat-card class="conversations-card">
        @if (loadingService.isLoading()) {
        <app-loading-overlay></app-loading-overlay>
        }

        <mat-card-header>
            <mat-card-title>OmegaFY Chat</mat-card-title>
            <mat-card-subtitle>Escolha uma conversa para continuar.</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
            <div class="notes-grid">
                @for (conversation of conversations(); track conversation.conversationId) {
                <button type="button" class="note" (click)="openConversation(conversation.conversationId)">
                    <div class="note-head">
                        <strong>{{ conversation.displayName }}</strong>
                        @if (getMessageDate(conversation); as sendDate) {
                        <span>{{ sendDate | date:'dd/MM/yyyy HH:mm' }}</span>
                        } @else {
                        <span>Nenhuma atividade</span>
                        }
                    </div>

                    <p class="note-message">
                        <strong>{{ conversation.lastMessage?.senderDisplayName }}: </strong>
                        {{ conversation.lastMessage?.content?.trim() }}
                    </p>

                    <div class="note-chips">
                        <small class="chip">{{ toConversationTypeLabel(conversation.type) }}</small>
                        <small class="chip">{{ toConversationStatusLabel(conversation.status) }}</small>
                    </div>
                </button>
                } @empty {
                <p>Nenhuma conversa encontrada.</p>
                }
            </div>
        </mat-card-content>
    </mat-card>
</div>
