<h2 mat-dialog-title class="create-group-dialog__title">
    <span class="material-icons" aria-hidden="true">groups</span>
    Criar novo grupo
</h2>

<mat-dialog-content class="create-group-dialog__content">
    <mat-form-field appearance="outline" class="create-group-dialog__field">
        <mat-label>Nome do grupo</mat-label>
        <input matInput [(ngModel)]="groupName" [disabled]="isLoading()" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="create-group-dialog__field">
        <mat-label>Máximo de membros</mat-label>
        <input matInput type="number" [(ngModel)]="maxMembers" [disabled]="isLoading()" min="2" />
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button type="button" mat-button (click)="close()" [disabled]="isLoading()">
        <span class="material-icons" aria-hidden="true">close</span>
        Cancelar
    </button>
    <button type="button" mat-flat-button color="primary" (click)="createGroup()" [disabled]="isLoading()">
        <ng-container>
            @if (isLoading()) {
                <span>Criando...</span>
            } @else {
                <span class="material-icons" aria-hidden="true">add</span>
                <span>Criar</span>
            }
        </ng-container>
    </button>
</mat-dialog-actions>
