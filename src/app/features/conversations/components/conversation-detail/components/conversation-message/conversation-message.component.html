@if (message().status !== MemberMessageStatus.Deleted) {
    <div #messageElements [attr.data-message-id]="message().messageId">
        @if (message().isMessageFromMember) {
            <app-conversation-my-message [message]="message()" (messageDeleted)="onMessageDeleted(message())" />
        } @else {
            <app-conversation-others-message [message]="message()" (messageDeleted)="onMessageDeleted(message())" />
        }
    </div>
} @else {
    <div #messageElements [attr.data-message-id]="message().messageId">
        <app-conversation-message-deleted />
    </div>
}
