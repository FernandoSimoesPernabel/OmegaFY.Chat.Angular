@if (message().status === MemberMessageStatus.Deleted) {
    <app-conversation-message-deleted [message]="message()" />
} @else if (message().isMessageFromMember) {
    <app-conversation-my-message [message]="message()" (messageDeleted)="onMessageDelete($event)" />
} @else {
    <app-conversation-others-message [message]="message()" (messageDeleted)="onMessageDelete($event)" />
}
