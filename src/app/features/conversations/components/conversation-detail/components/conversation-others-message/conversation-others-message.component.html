<article class="message message--other"
    [class.message--unread]="message().status === MemberMessageStatus.Unread">
    <header class="message__meta">
        <strong class="message__author">
            <span class="material-icons message__author-icon" aria-hidden="true">person_outline</span>
            {{ message().senderDisplayName }}
        </strong>

        <time [attr.datetime]="message().sendDate" class="message__time">
            <span class="material-icons message__time-icon" aria-hidden="true">schedule</span>
            {{ message().sendDate | appConversationDateTime }}
        </time>

        @if (message().status === MemberMessageStatus.Unread) {
            <span class="message__unread-badge" aria-label="Mensagem não lida">
                <span class="material-icons" aria-hidden="true">mail</span>
            </span>
        }
    </header>

    <p>
        <span class="material-icons message__content-icon" aria-hidden="true">chat_bubble</span>
        {{ message().content }}
    </p>

    <footer class="message__actions">
        <button mat-icon-button class="message__action-button" (click)="deleteMessage()" type="button"
            matTooltip="Deletar mensagem" aria-label="Deletar mensagem">
            <span class="material-icons" aria-hidden="true">delete</span>
        </button>
    </footer>
</article>
