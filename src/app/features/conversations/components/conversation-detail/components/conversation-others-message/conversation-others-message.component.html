<article class="message message--other">
    <header class="message__meta">
        <strong class="message__author">
            <span class="material-icons message__author-icon" aria-hidden="true">person_outline</span>
            {{ message().senderDisplayName }}
        </strong>

        <time [attr.datetime]="message().sendDate" class="message__time">
            <span class="material-icons message__time-icon" aria-hidden="true">schedule</span>
            {{ message().sendDate | appConversationDateTime }}
        </time>
    </header>

    <p>
        <span class="material-icons message__content-icon" aria-hidden="true">chat_bubble</span>
        {{ message().content }}
    </p>
</article>
